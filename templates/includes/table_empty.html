<div class="text-center py-5 my-5">
    <div class="mb-4">
        <i class="{% if icon %}{{ icon }}{% else %}fa-solid fa-folder-open{% endif %} text-muted opacity-25" style="font-size: 4rem;"></i>
    </div>
    <h4 class="fw-bold">{{ title|default:"No records found" }}</h4>
    <p class="text-muted mx-auto mb-4" style="max-width: 400px;">{{ message|default:"There is no data to display in this table at the moment." }}</p>
    {% if action_url %}
        <a href="{{ action_url }}" class="btn-crm btn-crm-primary">
            {% if action_icon %}<i class="{{ action_icon }} me-2 small"></i>{% endif %}
            {{ action_label }}
        </a>
    {% endif %}
</div>
