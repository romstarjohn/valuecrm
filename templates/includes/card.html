<div class="crm-card {% if class %}{{ class }}{% endif %}">
    {% if title %}
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0 fs-6 fw-bold text-uppercase text-muted letter-spacing-wider" style="letter-spacing: 0.05em;">{{ title }}</h5>
        {% if header_action %}
            {{ header_action|safe }}
        {% endif %}
    </div>
    {% endif %}
    
    {% block card_content %}
        {{ content|safe }}
    {% endblock %}

    {% if footer %}
    <div class="mt-4 pt-3 border-top">
        {{ footer|safe }}
    </div>
    {% endif %}
</div>
