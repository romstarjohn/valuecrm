<div class="page-header shadow-sm border-bottom">
    <div class="container-fluid">
        <div class="row align-items-center">
            <div class="col-md-7">
                <nav aria-label="Breadcrumb" class="mb-2">
                    <ol class="breadcrumb mb-0 small">
                        <li class="breadcrumb-item"><a href="{% url 'dashboard:index' %}" class="text-decoration-none">Accueil</a></li>
                        <li class="breadcrumb-item active" aria-current="page">{{ title }}</li>
                    </ol>
                </nav>
                <h1 class="page-title h3 mb-1">{{ title }}</h1>
                {% if subtitle %}
                    <p class="text-muted small mb-0 fw-medium"><i class="fa-solid fa-circle-info me-1 opacity-50" aria-hidden="true"></i> {{ subtitle }}</p>
                {% endif %}
            </div>
            <div class="col-md-5 text-md-end mt-3 mt-md-0">
                {% if action_url %}
                <a href="{{ action_url }}" class="btn-crm btn-crm-primary shadow-sm">
                    {% if action_icon %}<i class="{{ action_icon }} me-2 small" aria-hidden="true"></i>{% endif %}
                    {{ action_label }}
                </a>
                {% endif %}
                {% block extra_header_actions %}{% endblock %}
            </div>
        </div>
    </div>
</div>
