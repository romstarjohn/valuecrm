<div class="card {% if variant %}border-{{ variant }}{% endif %}">
    {% if title %}
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fs-6 fw-bold text-uppercase text-muted">{{ title }}</h5>
        {% if header_action %}
            {{ header_action|safe }}
        {% endif %}
    </div>
    {% endif %}
    <div class="card-body">
        {% block card_body %}{{ content|safe }}{% endblock %}
    </div>
    {% if footer %}
    <div class="card-footer bg-white border-top-0 py-3">
        {{ footer|safe }}
    </div>
    {% endif %}
</div>
