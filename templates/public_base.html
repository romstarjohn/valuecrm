{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Checkout | ValuedCRM{% endblock %}</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom Design System — same tokens/components as the staff portal (static/css/app.css) -->
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!--
        Public/guest checkout shell — deliberately NOT templates/base.html.
        base.html's sidebar (templates/includes/sidebar.html) and topbar
        (templates/includes/topbar.html) are staff-portal navigation and an
        authenticated-user account menu; neither applies to an anonymous
        customer buying a course. This template reuses the same design
        system (app.css tokens, .crm-card, .btn-crm, .form-control, status
        badges) without that internal navigation chrome.
    -->
    <div class="container py-5" style="max-width: 720px;">
        <div class="text-center mb-4">
            <i class="fa-solid fa-bridge text-primary me-2 fs-4"></i>
            <span class="fw-bold fs-4">ValuedCRM</span>
        </div>
        {% include "includes/messages.html" %}
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
