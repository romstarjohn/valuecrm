{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Checkout | ValuedCRM{% endblock %}</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom Design System — same tokens/components as the staff portal -->
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/utilities.css' %}">
    <!-- Checkout-specific shell (header/footer/layout) — public pages only -->
    <link rel="stylesheet" href="{% static 'css/checkout.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="checkout-body">
    <!--
        Public/guest checkout shell — deliberately NOT templates/base.html.
        base.html's sidebar (templates/includes/sidebar.html) and topbar
        (templates/includes/topbar.html) are staff-portal navigation and an
        authenticated-user account menu; neither applies to an anonymous
        customer buying a course. This template reuses the same design
        system (tokens, .crm-card, .btn-crm, .form-control, status badges)
        without that internal navigation chrome — plus a minimal public
        header/footer defined in static/css/checkout.css.
    -->
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="checkout-header">
        <div class="checkout-header-inner">
            <span class="checkout-brand">
                <i class="fa-solid fa-bridge" aria-hidden="true"></i>
                <span>ValuedCRM</span>
            </span>
        </div>
    </header>

    <main id="main-content" class="checkout-shell{% block shell_modifier %}{% endblock %}">
        {% include "includes/messages.html" %}
        {% block content %}{% endblock %}
    </main>

    <footer class="checkout-footer">
        <div class="checkout-footer-inner">
            <span>&copy; {% now "Y" %} ValuedCRM. All rights reserved.</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
